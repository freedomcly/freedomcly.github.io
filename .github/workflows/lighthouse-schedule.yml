name: Lighthouse CI - Scheduled

on:
  # 每天UTC时间0点运行（北京时间8点）
  schedule:
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  lighthouse-desktop:
    runs-on: ubuntu-latest
    name: Desktop Performance Test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Start static server
        run: |
          npx serve -s out -l 8080 &
          sleep 5
          
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
        
      - name: Run Lighthouse CI (Desktop)
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun --config=lighthouserc.cjs
          
      - name: Upload Desktop Results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-desktop-results
          path: .lighthouseci/
          retention-days: 7

  lighthouse-mobile:
    runs-on: ubuntu-latest
    name: Mobile Performance Test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Start static server
        run: |
          npx serve -s out -l 8080 &
          sleep 5
          
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
        
      - name: Run Lighthouse CI (Mobile)
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun --config=lighthouserc.mobile.cjs
          
      - name: Upload Mobile Results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-results
          path: .lighthouseci/
          retention-days: 7

  performance-summary:
    runs-on: ubuntu-latest
    needs: [lighthouse-desktop, lighthouse-mobile]
    name: Performance Summary
    
    steps:
      - name: Download Desktop Results
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-desktop-results
          path: ./desktop-results
          
      - name: Download Mobile Results
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-mobile-results
          path: ./mobile-results
          
      - name: Create Performance Summary
        run: |
          echo "# 📊 Daily Performance Report - $(date +'%Y-%m-%d')" > performance-summary.md
          echo "" >> performance-summary.md
          echo "## 🖥️ Desktop Performance" >> performance-summary.md
          echo "- Test completed at: $(date)" >> performance-summary.md
          echo "- Results stored in artifacts" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "## 📱 Mobile Performance" >> performance-summary.md
          echo "- Test completed at: $(date)" >> performance-summary.md
          echo "- Results stored in artifacts" >> performance-summary.md
          echo "" >> performance-summary.md
          echo "## 🎯 Next Steps" >> performance-summary.md
          echo "1. Review detailed results in artifacts" >> performance-summary.md
          echo "2. Check for performance regressions" >> performance-summary.md
          echo "3. Implement optimizations if needed" >> performance-summary.md
          
      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: performance-summary
          path: performance-summary.md
          retention-days: 30